<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Who's Watching?</title>
    <link rel="icon" type="image/png" href="images/S-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/users.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <a href="/logout" class="logout-link">Sign Out</a>
    <div class="profiles-container text-center">
        <h1>Who's Watching?</h1>

        <div id="profiles-list" class="profiles-list d-flex justify-content-center gap-4 mb-5">
            <!-- persona cards are injected here by the script below -->

            <div class="profile add-btn">
                <div class="profile-icon plus">
                    <span>+</span>
                </div>
                <span class="profile-name">Add Profile</span>
            </div>
        </div>

        <button class="btn btn-outline-secondary manage-profiles text-uppercase mt-2 px-4 py-2">
            Manage Profiles
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // fetch personas from server and build the cards dynamically
        fetch('/api/personas')
            .then(res => res.json())
            .then(personas => {
                const list = document.getElementById('profiles-list');
                const addBtn = list.querySelector('.add-btn');

                // build one card per persona and insert before the Add Profile button
                personas.forEach(persona => {
                    const a = document.createElement('a');
                    a.href = `interface.html?persona=${persona.id}`;
                    a.className = 'profile-link text-decoration-none';
                    a.innerHTML = `
                        <div class="profile">
                            <div class="profile-icon">
                                <img src="${persona.avatar}" alt="${persona.name}">
                            </div>
                            <span class="profile-name">${persona.name}</span>
                        </div>`;
                    list.insertBefore(a, addBtn);
                });
            });
    </script>
</body>
</html>
