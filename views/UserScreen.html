<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Who's Watching?</title>
    <link rel="icon" type="image/png" href="images/S-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/users.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <a href="/logout" class="logout-link">Sign Out</a>
    <div class="profiles-container text-center">
        <h1>Who's Watching?</h1>

        <div id="profiles-list" class="profiles-list d-flex justify-content-center gap-4 mb-5">
            <!-- persona cards are injected here by the script below -->

            <div class="profile add-btn">
                <div class="profile-icon plus">
                    <span>+</span>
                </div>
                <span class="profile-name">Add Profile</span>
            </div>
        </div>

        <button class="btn btn-outline-secondary manage-profiles text-uppercase mt-2 px-4 py-2">
            Manage Profiles
        </button>
    </div>

    <!-- Add Profile modal -->
    <div class="modal fade" id="addProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content add-profile-modal">
                <div class="modal-header">
                    <h5 class="modal-title">Add Profile</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="new-persona-name" class="form-control persona-name-input"
                        placeholder="Enter a name" maxlength="30">
                    <div id="persona-error" class="text-danger mt-2 d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="save-persona-btn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/profiles.js"></script>
</body>
</html>
