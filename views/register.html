<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StreamFlix - Register</title>
    <link rel="icon" type="image/png" href="/images/S-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/LoginPage.css">
</head>
<body class="d-flex flex-column align-items-center min-vh-100">

<header class="d-flex align-items-center w-100 px-5 py-2">
    <a href="/" class="logo">StreamFlix</a>
</header>

<main class="login-form">
    <h1>Register</h1>

    <form id="registerForm" novalidate>
        <div id="registerMessage" class="error-msg mb-3 text-center"></div>

        <div class="mb-3">
            <input type="text" id="nameInput" class="form-control" placeholder="Full name">
            <span class="error-msg" id="nameError"></span>
        </div>

        <div class="mb-3">
            <input type="email" id="emailInput" class="form-control" placeholder="Email">
            <span class="error-msg" id="emailError"></span>
        </div>

        <div class="mb-3">
            <input type="password" id="passwordInput" class="form-control" placeholder="Password">
            <span class="error-msg" id="passwordError"></span>
        </div>

        <button type="submit" class="btn btn-danger w-100 py-3 fw-bold">Create Account</button>

        <div class="signup mt-4">
            <p>Already have an account? <a href="/">Login</a></p>
        </div>
    </form>
</main>

<script src="/js/register.js"></script>
</body>
</html>
